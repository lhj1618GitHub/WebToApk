name: Build APK

on:
  workflow_dispatch:
    inputs:
      html_file:
        description: '主页 HTML 文件路径（相对仓库根目录）'
        required: true
        default: 'index.html'
      assets_dir:
        description: '可选：额外静态资源目录（内容合并到 assets 根目录）'
        required: false
        default: ''
      app_name:
        description: '应用名称'
        required: true
        default: 'WebApp'
      package_name:
        description: '应用包名（applicationId）'
        required: true
        default: 'com.example.webapp'
      version_name:
        description: 'versionName'
        required: true
        default: '1.0.0'
      version_code:
        description: 'versionCode（整数）'
        required: true
        default: '1'
      icon_file:
        description: '可选：图标文件路径（png/jpg），留空使用系统默认图标'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HTML_FILE:        ${{ inputs.html_file }}
      EXTRA_ASSETS_DIR: ${{ inputs.assets_dir }}
      APP_NAME:         ${{ inputs.app_name }}
      PACKAGE_NAME:     ${{ inputs.package_name }}
      VERSION_NAME:     ${{ inputs.version_name }}
      VERSION_CODE:     ${{ inputs.version_code }}
      ICON_FILE:        ${{ inputs.icon_file }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: 安装 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: 准备 assets 与图标
        run: bash scripts/prepare-assets.sh

      - name: 构建 Debug APK（可直接安装）
        working-directory: android
        run: |
          gradle assembleDebug --no-daemon --stacktrace \
            -PappId="$PACKAGE_NAME" \
            -PappLabel="$APP_NAME" \
            -PversionName="$VERSION_NAME" \
            -PversionCode="$VERSION_CODE" \
            -PappIcon="$APP_ICON_REF"

      - name: 收集产物
        run: |
          SAFE_NAME=$(printf '%s' "$APP_NAME" | sed 's/[^A-Za-z0-9._-]/_/g')
          SAFE_NAME=${SAFE_NAME:-app}
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             "dist/${SAFE_NAME}-${VERSION_NAME}-universal.apk"
          echo "ARTIFACT_NAME=apk-${SAFE_NAME}-${VERSION_NAME}" >> "$GITHUB_ENV"
          ls -lh dist

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30